<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Big Burger</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="admin-page">
  <header class="topbar admin-top">
    <div class="brand brand-logo"><img src="/logo.png" alt="Big Burger" class="logo-img"><div><strong>ADMIN <span>BIG BURGER</span></strong><small>Cardápio, produtos e complementos</small></div></div>
    <nav><a href="/">🏠 Cardápio</a><a href="/motoboy">🏍️ Motoboy</a></nav>
  </header>

  <main class="admin-layout">
    <section class="admin-panel">
      <div class="admin-tabs">
        <button class="tab active" onclick="abrirTab('pedidos')">📋 Pedidos</button>
        <button class="tab" onclick="abrirTab('categorias')">🏷️ Categorias</button>
        <button class="tab" onclick="abrirTab('produtos')">🍔 Produtos</button>
        <button class="tab" onclick="abrirTab('complementos')">➕ Complementos</button>
      </div>

      <div id="pedidos" class="tab-content active">
        <div class="admin-head"><h1>Pedidos recebidos</h1><button class="btn red" onclick="loadPedidos()">Atualizar pedidos</button></div>
        <div id="pedidosOut" class="admin-card">Carregando...</div>
      </div>

      <div id="categorias" class="tab-content">
        <div class="admin-head"><h1>Categorias do cardápio</h1><button class="btn green" onclick="novo('categorias')">Nova categoria</button></div>
        <div class="admin-grid">
          <form class="admin-form" onsubmit="salvar(event,'categorias')">
            <input type="hidden" id="cat_id">
            <label>Nome da categoria<input id="cat_nome" placeholder="Ex: Burgers artesanais"></label>
            <label>Ordem<input id="cat_ordem" type="number" value="0"></label>
            <label class="check"><input id="cat_ativo" type="checkbox" checked> Ativo</label>
            <button class="btn red">Salvar categoria</button>
          </form>
          <div id="categoriasOut" class="admin-card"></div>
        </div>
      </div>

      <div id="produtos" class="tab-content">
        <div class="admin-head"><h1>Produtos do cardápio</h1><button class="btn green" onclick="novo('produtos')">Novo produto</button></div>
        <div class="admin-grid">
          <form class="admin-form" onsubmit="salvar(event,'produtos')">
            <input type="hidden" id="prod_id">
            <label>Categoria<select id="prod_categoria"></select></label>
            <label>Nome do produto<input id="prod_nome" placeholder="Ex: Big Bacon Cheddar"></label>
            <label>Descrição<textarea id="prod_descricao" placeholder="Descrição do lanche"></textarea></label>
            <label>Preço<input id="prod_preco" type="number" step="0.01" placeholder="29.90"></label>
            <label>Selo / destaque<input id="prod_badge" placeholder="Ex: MAIS PEDIDO, COMBO"></label>
            <label>URL da imagem<input id="prod_imagem" placeholder="Opcional: link da imagem"></label>
            <label>Ordem<input id="prod_ordem" type="number" value="0"></label>
            <label class="check"><input id="prod_ativo" type="checkbox" checked> Ativo</label>
            <button class="btn red">Salvar produto</button>
          </form>
          <div id="produtosOut" class="admin-card"></div>
        </div>
      </div>

      <div id="complementos" class="tab-content">
        <div class="admin-head"><h1>Complementos / adicionais</h1><button class="btn green" onclick="novo('complementos')">Novo complemento</button></div>
        <div class="admin-grid">
          <form class="admin-form" onsubmit="salvar(event,'complementos')">
            <input type="hidden" id="comp_id">
            <label>Nome do complemento<input id="comp_nome" placeholder="Ex: Bacon em cubos"></label>
            <label>Preço<input id="comp_preco" type="number" step="0.01" placeholder="5.00"></label>
            <label>Ordem<input id="comp_ordem" type="number" value="0"></label>
            <label class="check"><input id="comp_ativo" type="checkbox" checked> Ativo</label>
            <button class="btn red">Salvar complemento</button>
          </form>
          <div id="complementosOut" class="admin-card"></div>
        </div>
      </div>
    </section>
  </main>

<script>
const state={categorias:[],produtos:[],complementos:[]};
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function abrirTab(id){document.querySelectorAll('.tab,.tab-content').forEach(x=>x.classList.remove('active'));document.querySelector(`.tab[onclick="abrirTab('${id}')"]`).classList.add('active');document.getElementById(id).classList.add('active');}
async function api(tabela,method='GET',body=null,id=null){const url='/api/admin-menu?tabela='+tabela+(id?'&id='+id:'');const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify({...body,tabela}):null});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||JSON.stringify(d));return d.data;}
async function loadPedidos(){pedidosOut.innerHTML='Carregando...';try{const r=await fetch('/api/admin');const d=await r.json();pedidosOut.innerHTML=d.ok?`<table class="table"><tr><th>Cliente</th><th>Total</th><th>Status</th><th>Endereço</th></tr>${d.pedidos.map(p=>`<tr><td>${p.cliente_nome}<br><small>${p.cliente_telefone||''}</small></td><td>${brl(p.valor_total)}</td><td>${p.status}</td><td>${p.endereco}</td></tr>`).join('')}</table>`:JSON.stringify(d)}catch(e){pedidosOut.innerHTML='<div class="err">'+e.message+'</div>'}}
async function loadTudo(){try{state.categorias=await api('categorias');state.produtos=await api('produtos');state.complementos=await api('complementos');renderAdmin();}catch(e){document.querySelector('.admin-panel').insertAdjacentHTML('afterbegin','<div class="err">Erro: '+e.message+'</div>')}}
function renderAdmin(){
 prod_categoria.innerHTML=state.categorias.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('');
 categoriasOut.innerHTML=lista(state.categorias,'categorias',c=>`<b>${c.nome}</b><small>Ordem ${c.ordem||0} • ${c.ativo?'Ativo':'Inativo'}</small>`);
 produtosOut.innerHTML=lista(state.produtos,'produtos',p=>`<b>${p.nome}</b><small>${brl(p.preco)} • ${state.categorias.find(c=>c.id===p.categoria_id)?.nome||'Sem categoria'} • ${p.ativo?'Ativo':'Inativo'}</small><p>${p.descricao||''}</p>`);
 complementosOut.innerHTML=lista(state.complementos,'complementos',c=>`<b>${c.nome}</b><small>${brl(c.preco)} • Ordem ${c.ordem||0} • ${c.ativo?'Ativo':'Inativo'}</small>`);
}
function lista(arr,tabela,html){return arr.length?arr.map(x=>`<div class="admin-item"><div>${html(x)}</div><div><button onclick='editar("${tabela}",${JSON.stringify(x).replaceAll("'","&#39;")})'>Editar</button><button class="danger" onclick='excluir("${tabela}","${x.id}")'>Excluir</button></div></div>`).join(''):'<p>Nenhum item cadastrado.</p>'}
function novo(t){if(t==='categorias'){cat_id.value='';cat_nome.value='';cat_ordem.value=0;cat_ativo.checked=true} if(t==='produtos'){prod_id.value='';prod_nome.value='';prod_descricao.value='';prod_preco.value='';prod_badge.value='';prod_imagem.value='';prod_ordem.value=0;prod_ativo.checked=true} if(t==='complementos'){comp_id.value='';comp_nome.value='';comp_preco.value='';comp_ordem.value=0;comp_ativo.checked=true}}
function editar(t,x){abrirTab(t); if(t==='categorias'){cat_id.value=x.id;cat_nome.value=x.nome;cat_ordem.value=x.ordem||0;cat_ativo.checked=x.ativo!==false} if(t==='produtos'){prod_id.value=x.id;prod_categoria.value=x.categoria_id||'';prod_nome.value=x.nome;prod_descricao.value=x.descricao||'';prod_preco.value=x.preco||0;prod_badge.value=x.badge||'';prod_imagem.value=x.imagem_url||'';prod_ordem.value=x.ordem||0;prod_ativo.checked=x.ativo!==false} if(t==='complementos'){comp_id.value=x.id;comp_nome.value=x.nome;comp_preco.value=x.preco||0;comp_ordem.value=x.ordem||0;comp_ativo.checked=x.ativo!==false}}
async function salvar(ev,t){ev.preventDefault();let id,body;if(t==='categorias'){id=cat_id.value;body={nome:cat_nome.value,ordem:cat_ordem.value,ativo:cat_ativo.checked}} if(t==='produtos'){id=prod_id.value;body={categoria_id:prod_categoria.value,nome:prod_nome.value,descricao:prod_descricao.value,preco:prod_preco.value,badge:prod_badge.value,imagem_url:prod_imagem.value,ordem:prod_ordem.value,ativo:prod_ativo.checked}} if(t==='complementos'){id=comp_id.value;body={nome:comp_nome.value,preco:comp_preco.value,ordem:comp_ordem.value,ativo:comp_ativo.checked}} try{await api(t,id?'PUT':'POST',{...body,id});novo(t);await loadTudo();alert('Salvo com sucesso!')}catch(e){alert('Erro: '+e.message)}}
async function excluir(t,id){if(!confirm('Excluir este item?'))return;try{await api(t,'DELETE',null,id);await loadTudo()}catch(e){alert('Erro: '+e.message)}}
loadPedidos();loadTudo();
</script>
</body>
</html>
