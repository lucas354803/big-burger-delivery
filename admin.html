<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Big Burger</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><h1>Admin Big Burger</h1><div class="box"><button class="btn" onclick="load()">Atualizar pedidos</button><div id="out"></div></div><p><a href="/">Voltar</a></p></div><script>async function load(){out.innerHTML='Carregando...';const r=await fetch('/api/admin');const d=await r.json();out.innerHTML=d.ok?`<table class="table"><tr><th>Cliente</th><th>Total</th><th>Status</th><th>Endereço</th></tr>${d.pedidos.map(p=>`<tr><td>${p.cliente_nome}</td><td>R$ ${p.valor_total}</td><td>${p.status}</td><td>${p.endereco}</td></tr>`).join('')}</table>`:JSON.stringify(d)}load()</script></body></html>
