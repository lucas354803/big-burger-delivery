<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Big Burger</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Admin Big Burger</h1><button onclick="load()">Atualizar pedidos</button><div id="lista"></div><nav><a href="index.html">Cliente</a><a href="motoboy.html">Motoboy</a></nav></main><script>const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});async function load(){lista.innerHTML='Carregando...';const r=await fetch('/api/admin');const d=await r.json();if(!d.ok){lista.innerHTML=d.error;return}lista.innerHTML=d.pedidos.map(p=>`<section class="card"><h2>${p.cliente_nome}</h2><span class="badge">${p.status}</span><p>${p.cliente_telefone}</p><p>${p.endereco}</p><p>${p.observacao||''}</p><h3>${brl(p.valor_total)}</h3><pre>${JSON.stringify(p.itens,null,2)}</pre></section>`).join('')||'Sem pedidos'}load()</script></body></html>
