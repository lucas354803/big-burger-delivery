<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motoboy</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><h1>Rota Express - Motoboy</h1><div class="box"><input id="motoboy" placeholder="Nome do motoboy"><button class="btn" onclick="load()">Atualizar corridas</button><div id="out"></div></div><p><a href="/">Voltar</a></p></div><script>async function load(){out.innerHTML='Carregando...';const r=await fetch('/api/motoboy');const d=await r.json();out.innerHTML=d.ok?d.corridas.map(c=>`<div class="card"><h3>Entrega ${c.status}</h3><p><b>Cliente:</b> ${c.pedidos?.cliente_nome||''}</p><p><b>Endereço:</b> ${c.pedidos?.endereco||''}</p><p><b>Valor entrega:</b> R$ ${c.valor_entrega}</p><button class="btn" onclick="upd('${c.id}','aceita')">Aceitar</button><br><br><button class="btn" onclick="upd('${c.id}','finalizada')">Finalizar</button></div>`).join(''):JSON.stringify(d)}async function upd(id,status){await fetch('/api/motoboy',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status,motoboy_nome:motoboy.value||'Motoboy'})});load()}load()</script></body></html>
