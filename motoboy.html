<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rota Express Motoboy</title><link rel="stylesheet" href="/style.css"></head><body><div class="top"><div class="brand">🛵 Rota Express</div><div class="nav"><a href="/">Cardápio</a><a href="/admin.html">Admin</a></div></div><div class="wrap"><div class="install"><b>📲 Instale o app</b><br>Use pelo celular para receber entregas em tempo real.</div><h1>Corridas</h1><input id="motoboy" placeholder="Seu nome de motoboy"><div id="corridas" class="grid"></div></div><script>
function money(v){return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function load(){const r=await fetch('/api/motoboy');const j=await r.json();corridas.innerHTML=(j.corridas||[]).map(c=>`<div class="card"><h3>${c.pedidos?.cliente_nome||'Cliente'}</h3><p>${c.pedidos?.endereco_entrega||''}</p><p>Entrega: <b>${money(c.valor_entrega||0)}</b><br>Você recebe: <b>${money(c.valor_motoboy||0)}</b></p><span class="status ${c.status==='disponivel'?'ok':''}">${c.status}</span>${c.status==='disponivel'?`<button onclick="acao('${c.id}','aceita')">Aceitar entrega</button>`:''}${c.status==='aceita'?`<button class="red" onclick="acao('${c.id}','finalizada')">Finalizar entrega</button>`:''}</div>`).join('')}
async function acao(id,status){await fetch('/api/motoboy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({corrida_id:id,status,motoboy_nome:motoboy.value||'Motoboy'})});load()}load();setInterval(load,5000)
</script></body></html>
