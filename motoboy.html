<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motoboy Rota Express</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Rota Express</h1><button onclick="load()">Atualizar corridas</button><div id="lista"></div><nav><a href="index.html">Cliente</a><a href="admin.html">Admin</a></nav></main><script>async function acao(id,acao){await fetch('/api/motoboy',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,acao})});load()}async function load(){lista.innerHTML='Carregando...';const r=await fetch('/api/motoboy');const d=await r.json();if(!d.ok){lista.innerHTML=d.error;return}lista.innerHTML=d.corridas.map(c=>`<section class="card"><h2>Entrega</h2><span class="badge">${c.status}</span><p><b>Cliente:</b> ${c.pedidos?.cliente_nome||''}</p><p><b>Endereço:</b> ${c.pedidos?.endereco||''}</p><p><b>Valor entrega:</b> R$ ${Number(c.valor_entrega||0).toFixed(2)}</p><button onclick="acao('${c.id}','aceitar')">Aceitar</button><br><br><button onclick="acao('${c.id}','finalizar')">Finalizar</button></section>`).join('')||'Sem corridas'}load()</script></body></html>
