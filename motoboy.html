<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Motoboy Big Burger</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e21b1b">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="admin-page motoboy-page">
  <header class="topbar admin-top">
    <div class="brand brand-logo"><img src="/logo.png" alt="Big Burger" class="logo-img"><div><strong>ÁREA DO <span>MOTOBOY</span></strong><small>Escaneie o QR Code da comanda</small></div></div>
    <nav><a href="/">🏠 Cardápio</a></nav>
  </header>
  <main class="admin-layout">
    <section class="admin-panel">
      <div class="editor-title">
        <h1 id="tituloMotoboy">🏍️ Motoboy</h1>
        <p>Escaneie o QR Code impresso na comanda para registrar o pedido automaticamente no seu nome.</p>
      </div>
      <div class="admin-card">
        <div class="mini-grid">
          <button class="btn red" onclick="iniciarScanner()">📷 Escanear QR Code</button>
          <button class="btn ghost" onclick="registrarPedidoDaUrl()">✅ Registrar pedido aberto</button>
        </div>
        <div id="scannerBox" class="scanner-box" style="display:none">
          <video id="qrVideo" playsinline style="width:100%;max-width:420px;border-radius:16px;border:1px solid #333"></video>
          <p class="small">Aponte a câmera para o QR Code da comanda.</p>
        </div>
        <div class="mini-grid one-col">
          <label>Código/link do QR Code<input id="pedidoManual" placeholder="Cole aqui o link ou código do pedido"></label>
          <button class="btn ghost" onclick="registrarPedidoManual()">Registrar manualmente</button>
        </div>
        <div id="statusMotoboy" class="small"></div>
      </div>
      <div class="admin-card">
        <div class="admin-head"><h2>Minhas entregas registradas</h2><button class="btn red" onclick="loadPerfil()">Atualizar</button></div>
        <div id="minhasEntregas">Carregando...</div>
      </div>
    </section>
  </main>
<script>
const qs=new URLSearchParams(location.search);
const token=qs.get('token')||localStorage.getItem('motoboyToken')||'';
if(qs.get('token')) localStorage.setItem('motoboyToken',qs.get('token'));
let perfil=null, scanStream=null, scanTimer=null;
function brl(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function numeroPedido(p){return p?.numero_pedido?String(p.numero_pedido).padStart(2,'0'):String(p?.id||'').split('-')[0].toUpperCase();}
async function loadPerfil(){
  if(!token){statusMotoboy.innerHTML='<span class="err">Abra pelo link enviado pelo admin para identificar seu nome.</span>';minhasEntregas.innerHTML='';return;}
  const r=await fetch('/api/motoboys?token='+encodeURIComponent(token));
  const d=await r.json();
  if(!r.ok||!d.ok){statusMotoboy.innerHTML='<span class="err">Erro: '+(d.error||JSON.stringify(d))+'</span>';return;}
  perfil=d.motoboy; tituloMotoboy.textContent='🏍️ '+perfil.nome;
  const rows=(d.entregas||[]).map(e=>`<div class="order-card"><h3>Pedido #${numeroPedido(e.pedidos)}</h3><p><b>Cliente:</b> ${esc(e.pedidos?.cliente_nome||'')}</p><p><b>Endereço:</b> ${esc([e.pedidos?.cidade,e.pedidos?.bairro,e.pedidos?.rua].filter(Boolean).join(' • ')||e.pedidos?.endereco||'')}</p><p><b>Total:</b> ${brl(e.pedidos?.valor_total||0)} • <b>Entrega:</b> ${brl(e.valor_entrega||0)}</p><small>Registrado em ${new Date(e.created_at).toLocaleString('pt-BR')}</small></div>`).join('');
  minhasEntregas.innerHTML=rows||'<p class="empty-finance">Nenhuma entrega registrada ainda.</p>';
}
async function registrarPedido(pedido){
  if(!token){alert('Abra pelo link enviado pelo admin primeiro.');return;}
  statusMotoboy.textContent='Registrando pedido...';
  const r=await fetch('/api/motoboys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'scan',token,pedido_id:pedido})});
  const d=await r.json();
  if(!r.ok||!d.ok){statusMotoboy.innerHTML='<span class="err">Erro: '+(d.error||JSON.stringify(d))+'</span>';return;}
  statusMotoboy.innerHTML='✅ Pedido #'+numeroPedido(d.pedido)+' registrado para '+esc(d.motoboy.nome);
  pedidoManual.value=''; await loadPerfil();
}
function registrarPedidoDaUrl(){const pedido=qs.get('pedido')||qs.get('pedido_id'); if(!pedido){alert('Nenhum pedido aberto neste link.');return;} registrarPedido(pedido);}
function registrarPedidoManual(){const v=pedidoManual.value.trim(); if(!v){alert('Cole o link ou código do QR Code.');return;} registrarPedido(v);}
async function iniciarScanner(){
  if(!('BarcodeDetector' in window)){scannerBox.style.display='block'; statusMotoboy.innerHTML='⚠️ Seu navegador não tem leitor automático. Cole o código no campo manual.'; return;}
  scannerBox.style.display='block';
  scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  qrVideo.srcObject=scanStream; await qrVideo.play();
  const detector=new BarcodeDetector({formats:['qr_code']});
  clearInterval(scanTimer);
  scanTimer=setInterval(async()=>{
    try{const codes=await detector.detect(qrVideo); if(codes.length){pararScanner(); registrarPedido(codes[0].rawValue);}}catch(e){}
  },700);
}
function pararScanner(){clearInterval(scanTimer); if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;} scannerBox.style.display='none';}
loadPerfil();
if(qs.get('pedido')) setTimeout(()=>registrarPedidoDaUrl(),500);
</script>
  <button id="installAppBtn" class="install-app-btn">📲 Instalar App</button>
  <script src="/pwa.js"></script>
</body>
</html>
