<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Big Burger</title><link rel="stylesheet" href="/style.css"></head><body><div class="top"><div class="brand">Painel Big Burger</div><div class="nav"><a href="/">Cardápio</a><a href="/motoboy.html">Motoboy</a></div></div><div class="wrap"><h1>Pedidos</h1><p class="muted">Quando o Pix aprovar, o pedido muda para pago e cria corrida no Rota Express automaticamente.</p><table class="table"><thead><tr><th>Cliente</th><th>Valor</th><th>Status</th><th>Ação</th></tr></thead><tbody id="pedidos"></tbody></table></div><script>
function money(v){return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function load(){const r=await fetch('/api/admin');const j=await r.json();pedidos.innerHTML=(j.pedidos||[]).map(p=>`<tr><td><b>${p.cliente_nome}</b><br><span class="muted">${p.cliente_telefone}<br>${p.endereco_entrega}</span></td><td>${money(p.valor_total)}</td><td><span class="status">${p.status}</span></td><td><button onclick="statusPedido('${p.id}','em_preparo')">Em preparo</button><button class="dark" onclick="statusPedido('${p.id}','saiu_entrega')">Saiu entrega</button></td></tr>`).join('')}
async function statusPedido(id,status){await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pedido_id:id,status})});load()}load();setInterval(load,5000)
</script></body></html>
